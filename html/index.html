<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pl(ai)lister</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Google Sans', sans-serif; background-color: #121212; color: #F5F5F5; }
        .spotify-green { background-color: #1ED760; color: #07150B; }
        .spotify-green:hover { background-color: #3BE477; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6">

    <div class="w-full max-w-2xl mx-auto pt-10">
        <!-- Logo -->
        <div class="flex items-center gap-1 text-2xl font-bold tracking-tighter mb-8">
            pl<span class="w-6 h-6 border-2 border-[#1ED760] rounded-full inline-flex items-center justify-content text-[#1ED760] text-xs">ai</span>lister
        </div>

        <!-- Vista principal de creación -->
        <div id="view-create">
            <span class="text-[#1ED760] text-xs font-bold tracking-widest uppercase mb-2 block">Descubrimiento musical con IA</span>
            <h1 class="text-3xl md:text-4xl font-semibold mb-3">¿Qué quieres escuchar?</h1>
            <p class="text-neutral-400 text-sm mb-6">Describe un género, época o ambiente musical y nosotros preparamos la selección.</p>

            <div class="bg-[#1E1E1E] border border-[#383838] rounded-2xl p-4 shadow-xl">
                <textarea id="promptInput" rows="4" class="w-full bg-transparent text-white placeholder-neutral-500 focus:outline-none resize-none text-base" placeholder="Ej.: Rock alternativo de los 2000, oscuro y enérgico, con clásicos y grupos menos conocidos..."></textarea>
                
                <div class="flex justify-between items-center mt-4 pt-3 border-t border-[#383838]">
                    <div class="flex gap-4 text-sm text-neutral-400">
                        <span>Canciones: <strong id="lblCount" class="text-white">15</strong></span>
                    </div>
                    <button onclick="generatePlaylist()" id="btnGenerate" class="spotify-green font-semibold px-6 py-2.5 rounded-full transition flex items-center gap-2">
                        Generar playlist ↗
                    </button>
                </div>
            </div>
        </div>

        <!-- Vista de carga -->
        <div id="view-loading" class="hidden text-center py-20">
            <div class="inline-block w-8 h-8 border-4 border-[#1ED760] border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-neutral-300 font-medium">Creando tu selección musical con IA...</p>
        </div>

        <!-- Vista de resultados -->
        <div id="view-results" class="hidden">
            <span class="text-[#1ED760] text-xs font-bold tracking-widest uppercase mb-2 block">Paso 1 · Revisión</span>
            <h2 class="text-2xl font-semibold mb-4">Tu selección musical</h2>
            <div id="trackList" class="bg-[#1E1E1E] border border-[#383838] rounded-2xl p-4 space-y-3 mb-6 max-h-96 overflow-y-auto">
                <!-- Las canciones se inyectan aquí -->
            </div>
            <button onclick="resetApp()" class="w-full bg-[#292929] hover:bg-[#353535] text-white font-semibold py-3 rounded-full transition">
                ← Crear otra playlist
            </button>
        </div>
    </div>

    <footer class="text-neutral-500 text-xs py-4">
        Creado con HTML, Vercel Serverless y Gemini.
    </footer>

    <script>
        async function generatePlaylist() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                alert('Por favor describe qué música quieres escuchar.');
                return;
            }

            document.getElementById('view-create').classList.add('hidden');
            document.getElementById('view-loading').classList.remove('hidden');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, count: 15, artist_count: 5, temperature: 0.7 })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                renderTracks(data.tracks);
                document.getElementById('view-loading').classList.add('hidden');
                document.getElementById('view-results').classList.remove('hidden');

            } catch (err) {
                alert('Error al generar: ' + err.message);
                resetApp();
            }
        }

        function renderTracks(tracks) {
            const container = document.getElementById('trackList');
            container.innerHTML = '';
            tracks.forEach((track, idx) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between p-2 border-b border-[#292929] last:border-0">
                        <div class="flex items-center gap-3">
                            <span class="text-neutral-500 text-xs w-6">${String(idx + 1).padStart(2, '0')}</span>
                            <div>
                                <p class="font-semibold text-sm text-white">${track.title}</p>
                                <p class="text-xs text-neutral-400">${track.artist}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function resetApp() {
            document.getElementById('view-results').classList.add('hidden');
            document.getElementById('view-loading').classList.add('hidden');
            document.getElementById('view-create').classList.remove('hidden');
            document.getElementById('promptInput').value = '';
        }
    </script>
</body>
</html>
